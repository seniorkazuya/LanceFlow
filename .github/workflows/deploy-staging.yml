name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    defaults:
      run:
        working-directory: packages/core/database
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Apply database migrations (Neon staging)
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: migrate
    environment: staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@41.6.0

      # Run from repo root: Vercel project Root Directory is apps/web — running
      # inside apps/web doubles the path (apps/web/apps/web/package.json).
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Vercel (staging)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "### Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Save deployment URL
        run: echo "STAGING_DEPLOY_URL=${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_ENV"

  health:
    name: health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    environment: staging
    steps:
      - name: Resolve staging URL
        id: url
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          DEPLOY_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            base="$STAGING_URL"
          elif [ -n "$DEPLOY_URL" ]; then
            base="$DEPLOY_URL"
          else
            echo "::error::Set STAGING_URL in GitHub environment staging, or fix Vercel deploy output"
            exit 1
          fi
          base="${base%/}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Health check /api/health
        run: |
          url="${{ steps.url.outputs.base }}/api/health"
          echo "Checking $url"
          for i in 1 2 3 4 5; do
            if curl -fsS "$url" -o /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"status":"ok"' /tmp/health.json || grep -q '"status": "ok"' /tmp/health.json
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "::error::Health check failed for $url"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "### Staging is live" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: ${{ steps.url.outputs.base }}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "App: ${{ steps.url.outputs.base }}" >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: notify-failure
    runs-on: ubuntu-latest
    needs: [migrate, deploy, health]
    if: failure()
    steps:
      - name: Report failure
        run: echo "::error::Staging deploy failed. See Deploy Staging workflow logs and documents/docs/DEPLOY_STAGING.md"
