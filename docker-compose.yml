services:
  postgres:
    image: postgres:16-alpine
    container_name: lanceflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lanceflow
    volumes:
      - lanceflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lanceflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lanceflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lanceflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: docker compose --profile storage up -d
  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: lanceflow-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - lanceflow_minio_data:/data

volumes:
  lanceflow_postgres_data:
  lanceflow_redis_data:
  lanceflow_minio_data:
